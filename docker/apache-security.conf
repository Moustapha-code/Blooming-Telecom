# Fichiers et dossiers qui ne doivent jamais être servis par Apache.
#
# L'image Debian laisse AllowOverride à None : un .htaccess est ignoré en
# production, d'où cette configuration chargée depuis conf-enabled.
#
# Ces règles ne concernent que les requêtes HTTP. Les inclusions PHP
# (require 'config/database.php') lisent le disque et continuent de
# fonctionner normalement.

# Dumps SQL, scripts de synchronisation, historique Git.
<DirectoryMatch "^/var/www/html/(database|config|components|\.git)">
    Require all denied
</DirectoryMatch>

# Schémas et jeux de données : ils décrivent la base et contiennent les
# comptes administrateurs.
<FilesMatch "\.(sql|sqlite|db|lock|log|ini|bak|old|env)$">
    Require all denied
</FilesMatch>

# Manifestes d'outillage : versions de dépendances et arborescence interne.
<FilesMatch "^(composer\.json|package\.json|package-lock\.json|tsconfig\.json|components\.json|Dockerfile|render\.yaml)$">
    Require all denied
</FilesMatch>

# Fichiers cachés (.env, .git*, éditeurs).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Ne pas annoncer la version d'Apache ni lister les répertoires.
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
</Directory>
