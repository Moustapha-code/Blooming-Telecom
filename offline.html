<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne - Blooming FTTH</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 40px 28px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .06);
        }
        .mark {
            width: 76px; height: 76px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #3b82f6;
            display: flex; align-items: center; justify-content: center;
        }
        .mark svg { width: 44px; height: 44px; fill: #fff; }
        h1 { font-size: 1.2rem; margin: 0 0 10px; }
        p { margin: 0 0 22px; color: #64748b; font-size: .93rem; line-height: 1.55; }
        button {
            border: 0; border-radius: 10px; cursor: pointer;
            background: #3b82f6; color: #fff;
            padding: 11px 22px; font-size: .93rem; font-weight: 600;
        }
        button:hover { background: #2563eb; }
        @media (prefers-color-scheme: dark) {
            body { background: #0f172a; color: #e2e8f0; }
            .card { background: #1e293b; border-color: #334155; }
            p { color: #94a3b8; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 18.5a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5Zm0-5.2c1.7 0 3.26.66 4.42 1.74l-1.6 1.7A4.4 4.4 0 0 0 12 15.5c-1.09 0-2.09.4-2.85 1.06l-1.58-1.7A6.44 6.44 0 0 1 12 13.3Zm0-4.9c2.96 0 5.66 1.14 7.66 3l-1.58 1.7A9.02 9.02 0 0 0 12 10.6c-2.35 0-4.5.88-6.12 2.33l-1.57-1.7a11.15 11.15 0 0 1 7.69-2.93Z"/>
            </svg>
        </div>
        <h1>Vous êtes hors ligne</h1>
        <p>
            Blooming FTTH a besoin d'une connexion pour afficher les données à jour :
            OT, pointage et stocks ne sont volontairement pas mis en cache, afin de ne
            jamais vous montrer des chiffres périmés.
        </p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
